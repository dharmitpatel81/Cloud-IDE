# Journal 0008, experiment 2: the same pod inside a Deployment. Delete the pod
# and a new one is made from the template (1.1 s) — without the old one's files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workspace-demo
  template:
    metadata:
      labels:
        app: workspace-demo
        owner: dharmit
        project: demo
        created-at: "2026-09-13"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: workspace
          image: cloud-ide-workspace:phase5
          imagePullPolicy: Never
          command: ["sh", "-c", "trap 'exit 0' TERM; sleep infinity & wait"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "250m", memory: "256Mi", ephemeral-storage: "256Mi" }
            limits:   { cpu: "1",    memory: "512Mi", ephemeral-storage: "1Gi" }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: home,      mountPath: /home/node }
            - { name: tmp,       mountPath: /tmp }
      volumes:
        - { name: workspace, emptyDir: { sizeLimit: 1Gi } }
        - { name: home,      emptyDir: { sizeLimit: 512Mi } }
        - { name: tmp,       emptyDir: { sizeLimit: 64Mi } }
