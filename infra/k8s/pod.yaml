# Journal 0008, experiment 1: a bare pod. Delete it and nothing recreates it.
# Kept as the "before": plain `sleep` as PID 1 ignores SIGTERM, so deleting
# this pod takes the full 30 s grace period. deployment.yaml has the fix.
apiVersion: v1
kind: Pod
metadata:
  name: workspace-demo
  labels:
    owner: dharmit
    project: demo
    created-at: "2026-09-13"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: workspace
      image: cloud-ide-workspace:phase5
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
      resources:
        requests: { cpu: "250m", memory: "256Mi", ephemeral-storage: "256Mi" }
        limits:   { cpu: "1",    memory: "512Mi", ephemeral-storage: "1Gi" }
      volumeMounts:
        - { name: workspace, mountPath: /workspace }
        - { name: home,      mountPath: /home/node }
        - { name: tmp,       mountPath: /tmp }
  volumes:
    - { name: workspace, emptyDir: { sizeLimit: 1Gi } }
    - { name: home,      emptyDir: { sizeLimit: 512Mi } }
    - { name: tmp,       emptyDir: { sizeLimit: 64Mi } }
