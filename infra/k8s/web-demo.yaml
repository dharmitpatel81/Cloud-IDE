# Journal 0009: two identical pods behind one Service. The Service keeps one
# address while pods are replaced, and sends each connection to any pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-demo
  template:
    metadata:
      labels:
        app: web-demo
        owner: dharmit
        project: demo
        created-at: "2026-09-13"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: cloud-ide-workspace:phase5
          imagePullPolicy: Never
          command:
            - node
            - -e
            - |
              process.on('SIGTERM', () => process.exit(0));
              require('http').createServer((req, res) => {
                res.end(require('os').hostname() + '\n');
              }).listen(8080);
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "100m", memory: "64Mi",  ephemeral-storage: "64Mi" }
            limits:   { cpu: "250m", memory: "128Mi", ephemeral-storage: "128Mi" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: web-demo
spec:
  selector:
    app: web-demo
  ports:
    - port: 80
      targetPort: 8080
